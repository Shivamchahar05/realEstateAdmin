<section class="login-page">
  <div class="login-panel">
    <div class="hero">
      <p class="eyebrow">Verified Property</p>
      <h1>Property dhoondhna aapka kaam hai.<br />Operations hamara.</h1>
      <p class="lede">
        Secure staff console for verification workflow, document review, inspections and
        transaction coordination.
      </p>
    </div>

    <form class="card-form" [formGroup]="form" (ngSubmit)="submit()">
      <h2>Staff sign in</h2>

      @if (error()) {
        <div class="alert">{{ error() }}</div>
      }

      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small>Enter a valid email</small>
        }
      </label>

      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small>Minimum 8 characters</small>
        }
      </label>

      <button class="btn primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</section>
